<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>catsubufer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
  }
  #sakura {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,150,200,0.08), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(180,0,255,0.06), transparent 45%);
    z-index: 1;
    pointer-events: none;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(17,17,17,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 32px 24px;
    position: relative;
    z-index: 2;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, #ff8fbf, #b400ff);
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #ff8fbf;
    display: block;
    margin: 0 auto 16px;
    box-shadow: 0 0 24px rgba(255,143,191,0.4);
  }
  .prompt {
    color: #ff8fbf;
    font-size: 13px;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 28px;
    font-weight: normal;
    color: #fff;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }
  h1::after {
    content: '_';
    color: #ff8fbf;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 15px;
  }
  .row:last-child { border-bottom: none; }
  .label { color: #777; font-size: 13px; white-space: nowrap; }
  .value { color: #e0e0e0; text-align: right; }
  .value.accent {
    color: #ff8fbf;
    text-decoration: none;
    transition: 0.2s;
  }
  .value.accent::after {
    content: ' ↗';
    font-size: 13px;
    opacity: 0.7;
    transition: 0.2s;
  }
  .value.accent:hover {
    color: #fff;
    text-shadow: 0 0 12px #ff8fbf;
  }
  .value.accent:hover::after {
    opacity: 1;
  }
  .value.dim { color: #444; font-style: italic; }
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #555;
    text-align: center;
  }
</style>
</head>
<body>
  <canvas id="sakura"></canvas>

  <div class="card">
    <img src="avatar.jpg" alt="avatar" class="avatar" onerror="this.style.display='none'">

    <div class="prompt">~/profile $ whoami</div>
    <h1>catsubufer</h1>

    <div class="row">
      <span class="label">username</span>
      <a class="value accent" href="https://t.me/bablllls" target="_blank" rel="noopener">@bablllls</a>
    </div>
    <div class="row">
      <span class="label">age</span>
      <span class="value dim">???</span>
    </div>
    <div class="row">
      <span class="label">date</span>
      <span class="value dim">secret</span>
    </div>
    <div class="row">
      <span class="label">country</span>
      <span class="value">Russia 🇷🇺</span>
    </div>
    <div class="row">
      <span class="label">vibe</span>
      <span class="value accent">internet friend )</span>
    </div>
    <div class="row">
      <span class="label">описание</span>
      <span class="value">люблю кодить, писать музыку</span>
    </div>
    <div class="row">
      <span class="label">статус</span>
      <span class="value accent">coding chelik )</span>
    </div>

    <div class="footer">// просто челик который любит код и звук</div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('sakura');
  const ctx = canvas.getContext('2d');
  let W, H, petals = [];
  const COUNT = 45;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const COLORS = ['#ffb7d5', '#ff8fbf', '#ffa8cc', '#f7c8dd', '#ff7fb0'];

  function newPetal(initial) {
    const size = 6 + Math.random() * 10;
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : -20 - Math.random() * 60,
      size: size,
      speedY: 0.5 + Math.random() * 1.3,
      speedX: -0.5 + Math.random() * 1.0,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.01 + Math.random() * 0.02,
      swayAmount: 0.6 + Math.random() * 1.4,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (-0.02 + Math.random() * 0.04),
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      alpha: 0.5 + Math.random() * 0.5,
      blur: size < 8 ? 0 : (Math.random() < 0.3 ? 1.2 : 0)
    };
  }

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.alpha;
    if (p.blur) ctx.filter = 'blur(' + p.blur + 'px)';

    ctx.fillStyle = p.color;
    ctx.beginPath();
    const s = p.size;
    ctx.moveTo(0, -s);
    ctx.bezierCurveTo(s * 0.9, -s * 0.6, s * 0.7, s * 0.7, 0, s);
    ctx.bezierCurveTo(-s * 0.7, s * 0.7, -s * 0.9, -s * 0.6, 0, -s);
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = p.alpha * 0.4;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-s * 0.15, -s * 0.2, s * 0.18, s * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < petals.length; i++) {
      const p = petals[i];
      p.sway += p.swaySpeed;
      p.y += p.speedY;
      p.x += p.speedX + Math.sin(p.sway) * p.swayAmount;
      p.rot += p.rotSpeed;

      if (p.y > H + 30 || p.x < -50 || p.x > W + 50) {
        petals[i] = newPetal(false);
      }
      drawPetal(p);
    }
    requestAnimationFrame(tick);
  }

  function makePetals() {
    petals = [];
    for (let i = 0; i < COUNT; i++) {
      petals.push(newPetal(true));
    }
  }

  makePetals();
  tick();
})();
</script>
</body>
</html>
